<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grappling Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#070b19;--nav:#0a1022;--card:#0f1630;--ink:#fff;--muted:#9aa4c0;--accent:#1e8bff;--accent2:#35d07f;--line:#222b4a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#13204a55,transparent),var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.5}
.banner{background:#0b1330;border-bottom:1px solid var(--line);text-align:center;padding:10px 14px;font-size:13px;color:#dfe5f7}
.banner .b{background:#12307a;color:#5fb0ff;font-weight:700;font-size:11px;padding:4px 8px;border-radius:5px;margin-right:8px;letter-spacing:.04em}
.banner a{color:var(--accent);font-weight:600;margin-left:8px;text-decoration:none}
nav{background:var(--nav);border-bottom:1px solid var(--line)}
nav div{max-width:1140px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:.04em;font-size:18px}.logo span{color:var(--accent)}
.navbtn{border:1px solid #fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}
.hero{max-width:1140px;margin:0 auto;padding:44px 20px 18px}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.pill{border:1px solid #2b3556;background:#0c1330;border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600}
h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:1.02;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;max-width:780px}
.sub{color:var(--muted);font-size:16px;margin-top:16px;max-width:560px}
main{max-width:1140px;margin:0 auto;padding:18px 20px 50px;display:grid;grid-template-columns:310px 1fr;gap:24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:14px;color:var(--ink)}
.search::placeholder{color:#6d7798}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid #2b3556;background:#0c1330;color:var(--ink);padding:6px 13px;border-radius:99px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent)}
.item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;margin-bottom:10px;align-items:center}
.item.on{border-color:var(--accent);box-shadow:0 0 0 2px #1e8bff33}
.item img{width:48px;height:64px;object-fit:cover;border-radius:8px}
.item b{font-size:14px;display:block;font-weight:700}
.item small{color:var(--muted);font-size:12px}
.soon{border-style:dashed;color:var(--muted);cursor:default;justify-content:center;font-size:13px;padding:16px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.player{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:22px}
@media(max-width:640px){.player{grid-template-columns:1fr}}
video{width:100%;border-radius:14px;background:#000;max-height:70vh}
.code{font-size:12px;color:var(--accent);letter-spacing:.1em;font-weight:700}
h2{margin:2px 0 8px;font-size:24px;font-weight:800;text-transform:uppercase;line-height:1.15}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;background:#16204a;color:#a9c4ff;font-weight:600}
.meta{font-size:13px;color:var(--muted);margin-bottom:10px}
h3{font-size:13px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent2);font-weight:700}
.chap{list-style:none;padding:0;margin:0}
.chap li{display:flex;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;align-items:baseline}
.chap li:hover{background:#151e40}
.chap li.now{background:#10306b}
.chap .t{color:var(--accent);font-weight:700;min-width:42px;font-variant-numeric:tabular-nums}
.chap .d{color:var(--muted);font-size:12px;display:block}
.ok{margin-top:16px;font-size:14px;display:flex;gap:8px;align-items:center}
.note{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}

.folders{display:flex;flex-direction:column;gap:12px}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;border:1px solid var(--line);background:var(--card);border-radius:16px;cursor:pointer;transition:border-color .15s,background .15s}
.fbar:hover{border-color:var(--accent);background:#121b3a}
.fbar h2{margin:0;font-size:clamp(20px,3.4vw,30px);font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.fbar p{margin:4px 0 0;color:var(--muted);font-size:13px}
.fbar .n{white-space:nowrap;font-size:13px;color:#a9c4ff;font-weight:700;display:flex;align-items:center;gap:12px}
.fbar .arr{color:var(--accent);font-size:22px}
.back{background:none;border:1px solid #2b3556;color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px}
.back:hover{border-color:var(--accent)}
.vtitle{margin:0 0 4px;font-size:clamp(24px,4vw,38px);font-weight:800;text-transform:uppercase}
.vdesc{color:var(--muted);margin-bottom:18px;font-size:14px}
.rtitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin:6px 0 10px}
main{display:block!important;max-width:900px}

.banner{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 16px;overflow:hidden}
.banner .b{flex:none;margin-right:0}
.mq{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.mqt{display:inline-flex;animation:mq 30s linear infinite;will-change:transform}
.mq:hover .mqt{animation-play-state:paused}
.mqi{display:inline-block;padding-right:56px;cursor:pointer;color:#dfe5f7}
.mqi b{color:#fff;font-weight:700}.mqi i{font-style:normal;color:#5fb0ff;font-weight:600}
.mqi:hover b{text-decoration:underline}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mqt{animation:none}}

.coffee{max-width:900px;margin:10px auto 50px;padding:0 20px}
.cbox{border:1px dashed #2b3556;background:var(--card);border-radius:18px;padding:22px;text-align:center}
.cbox h4{margin:0 0 6px;font-size:20px;font-weight:800;text-transform:uppercase}
.cbox p{margin:4px 0;color:var(--muted);font-size:14px}
.cbox .amt{color:#a9c4ff;font-weight:700}
.cbtn{margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.cbtn:hover{filter:brightness(1.1)}
.qr{display:none;margin-top:18px}
.qr.on{display:block}
.qr img{width:100%;max-width:300px;border-radius:14px;background:#fff}
.favbtn{background:transparent;border:1px solid var(--accent);color:#a9c4ff}.favbtn.on{background:var(--accent);color:#fff}
.svmsg{font-family:Montserrat,system-ui,sans-serif;font-size:13px;color:var(--muted);margin-left:10px}
.navr{display:flex;gap:10px;align-items:center}
a.navbtn{color:#fff;text-decoration:none;font-size:14px;font-weight:600}
a.navbtn:hover{border-color:var(--accent);color:#a9c4ff}
#navfc{color:#a9c4ff}
.src{font-size:13px;color:var(--muted);margin:-4px 0 10px}.src a{color:#7db8ff;font-weight:600;text-decoration:none}.src a:hover{text-decoration:underline}

.lotd{display:flex;gap:18px;align-items:center;border:1px solid var(--accent);background:linear-gradient(135deg,#0f1c3d,#0f1630);border-radius:18px;padding:16px;margin-bottom:16px;cursor:pointer}
.lotd img{width:96px;height:128px;object-fit:cover;border-radius:12px;flex:none}
.lotd .lk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
.lotd h3{margin:4px 0 6px;font-size:clamp(18px,3vw,24px);font-weight:800;text-transform:uppercase;line-height:1.15;letter-spacing:0;color:#fff}
.lotd p{margin:0 0 10px;color:#c9d2ea;font-size:14px}
.lotd .lm{font-size:12px;color:var(--muted);margin-bottom:10px}
.lotd button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.wbtns{display:flex;gap:8px;flex-wrap:wrap}
.lotd .wbtns button.alt{background:transparent;border:1px solid var(--accent);color:var(--accent)}
@media(max-width:560px){.lotd{flex-direction:column;align-items:flex-start}.lotd img{width:100%;height:180px}}
</style>
</head>

function lotdPick(){
  const n=LESSONS.length;if(!n)return null;
  const d=new Date();

  const rnd=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
  const order=LESSONS.map((_,i)=>i).sort((x,y)=>x-y);
  for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  return order[pos];
}
function lotdHtml(){
  const i=lotdPick();if(i==null)return "";
  const l=LESSONS[i],f=FOLDERS.find(x=>x.id===l.folder);
  return `<div class="lotd" id="lotd" data-i="${i}"><img src="${l.poster}" alt=""><div><div class="lk">Lesson of the day</div><h3>${l.title}</h3><p>${l.summary}</p><div class="lm">${f?f.name+" \u00B7 ":""}${l.level} \u00B7 ${l.dur}</div><div class="wbtns"><button id="lotdgo">Watch now</button><button class="alt" id="lotdmore">\u21BB Show another</button></div></div></div>`;
}

function home(){
  const q=$("#q").value.toLowerCase().trim();
  if(q){
    const r=LESSONS.filter(l=>(l.title+" "+l.tags.join(" ")+" "+l.position+" "+l.summary).toLowerCase().includes(q)).sort(byOrder);
    $("#view").innerHTML='<div class="rtitle">Search results</div>'+(r.length?r.map(item).join(""):'<div class="empty">No matching lessons</div>');
    bindItems();return;
  }
  $("#view").innerHTML=lotdHtml()+'<div class="folders">'+FOLDERS.map(f=>{const n=inFolder(f.id).length;
    return `<div class="fbar" data-f="${f.id}"><div><h2>${f.name}</h2><p>${f.desc}</p></div><div class="n">${n} ${n===1?"lesson":"lessons"}<span class="arr">›</span></div></div>`}).join("")+'</div>';
  document.querySelectorAll(".fbar").forEach(e=>e.onclick=()=>{location.hash=e.dataset.f});
  const lt=document.querySelector("#lotd");
  if(lt){
    lt.onclick=()=>{location.hash="lesson-"+lt.dataset.i};
    const mb=document.querySelector("#lotdmore");
    if(mb)mb.onclick=e=>{e.stopPropagation();
      const cur=+lt.dataset.i,pool=LESSONS.map((_,i)=>i).filter(i=>i!==cur);if(!pool.length)return;
      const i=pool[Math.floor(Math.random()*pool.length)],l=LESSONS[i],f=FOLDERS.find(x=>x.id===l.folder);
      lt.dataset.i=i;lt.querySelector("img").src=l.poster;lt.querySelector("h3").textContent=l.title;
      lt.querySelector("p").textContent=l.summary;lt.querySelector(".lm").textContent=(f?f.name+" \u00B7 ":"")+l.level+" \u00B7 "+l.dur;
      lt.querySelector(".lk").textContent="Random pick";};
  }
}
function favorites(){
  const ls=LESSONS.filter(l=>fav[l.id]).sort(byOrder);
  $("#view").innerHTML=`<button class="back" id="bk">\u2039 All folders</button><h2 class="vtitle">\u2605 My Favorites</h2><div class="vdesc">Lessons you saved to watch again, sorted from easiest to hardest. Saved in this browser only.</div>`+
   (ls.length?ls.map(item).join(""):'<div class="empty">No favorites yet. Open a lesson and tap "Add to favorites".</div>');
  $("#bk").onclick=()=>{location.hash="home"};bindItems();
}
function folder(id){
  const f=FOLDERS.find(x=>x.id===id);if(!f){location.hash="home";return}
  const ls=inFolder(id);
  $("#view").innerHTML=`<button class="back" id="bk">‹ All folders</button><h2 class="vtitle">${f.name}</h2><div class="vdesc">${f.desc} · Sorted from easiest to hardest</div>`+
   (ls.length?ls.map(item).join(""):'<div class="empty">No lessons in this folder yet</div>');
  $("#bk").onclick=()=>{location.hash="home"};bindItems();
}
function lesson(i){
  const l=LESSONS[i];if(!l){location.hash="home";return}
  const f=FOLDERS.find(x=>x.id===l.folder);
  $("#view").innerHTML=`<button class="back" id="bk">‹ ${f?f.name:"All folders"}</button><div class="stage"><div class="player">
   <div><video id="v" controls playsinline preload="metadata" poster="${l.poster}" src="${l.src}"></video></div>
   <div><h2>${l.title}</h2>
    <div class="meta">${l.position} · ${l.group} · ${l.mode} · ${l.level} · ${l.dur}</div>
    ${l.source?`<div class="src">Source: ${l.source.url?`<a href="${l.source.url}" target="_blank" rel="noopener">${l.source.name}</a>`:`<b>${l.source.name}</b>`}${l.source.extra?" ("+l.source.extra+")":""} on ${l.source.platform}</div>`:""}
    <div>${l.summary}</div>
    <div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    <button class="cbtn favbtn" id="fv"></button></div></div>
   <h3>Chapters</h3>
   <ul class="chap" id="chap">${l.chapters.map(c=>`<li data-t="${c[0]}"><span class="t">${fmt(c[0])}</span><span>${c[1]}${c[2]?`<span class="d">${c[2]}</span>`:""}</span></li>`).join("")}</ul>
   <h3>Key points</h3><ul>${l.points.map(p=>`<li>${p}</li>`).join("")}</ul>
   <label class="ok"><input type="checkbox" id="dn" ${done[l.id]?"checked":""}> Mark this lesson as completed</label>
   <div class="note">Technique names and timestamps were reconstructed from the on-screen captions and may be off by a few seconds.</div></div>`;
  $("#bk").onclick=()=>{location.hash=l.folder||"home"};
  const v=$("#v");
  document.querySelectorAll("#chap li").forEach(li=>li.onclick=()=>{v.currentTime=+li.dataset.t;v.play().catch(()=>{})});
  v.ontimeupdate=()=>{let k=-1;l.chapters.forEach((c,j)=>{if(v.currentTime>=c[0])k=j});
    document.querySelectorAll("#chap li").forEach((li,j)=>li.classList.toggle("now",j===k))};
  const fb=$("#fv");
  const paint=()=>{fb.textContent=fav[l.id]?"\u2605 Saved to favorites":"\u2606 Add to favorites";fb.classList.toggle("on",!!fav[l.id])};
  paint();fb.onclick=()=>{if(fav[l.id])delete fav[l.id];else fav[l.id]=true;saveFav();paint();counts()};
  $("#dn").onchange=e=>{done[l.id]=e.target.checked;try{localStorage.setItem("bjjdone",JSON.stringify(done))}catch(x){}counts()};
}
function route(){
  counts();
  const h=location.hash.replace("#","");
  const isHome=(h===""||h==="home");
  $("#q").style.display=isHome?"":"none";
  $("#coffee").style.display=isHome?"":"none";
  if(h.startsWith("lesson-"))lesson(+h.slice(7));
  else if(h==="favorites")favorites();
  else if(h&&h!=="home")folder(h);
  else home();
  window.scrollTo(0,0);
}
$("#navhome").onclick=()=>{$("#q").value="";if(!location.hash||location.hash==="#home")setTimeout(route,0)};
$("#q").oninput=()=>{if(!location.hash||location.hash==="#home")home();else location.hash="home"};
window.addEventListener("hashchange",route);
route();

function ago(iso){
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return "just now";
  const m=Math.floor(s/60);if(m<60)return m+(m===1?" minute":" minutes")+" ago";
  const hr=Math.floor(m/60);if(hr<24)return hr+(hr===1?" hour":" hours")+" ago";
  const d=Math.floor(hr/24);if(d<30)return d+(d===1?" day":" days")+" ago";
  const mo=Math.floor(d/30);if(mo<12)return mo+(mo===1?" month":" months")+" ago";
  const y=Math.floor(d/365);return y+(y===1?" year":" years")+" ago";
}
function ticker(){
  const recent=LESSONS.map((l,i)=>({l,i})).sort((a,b)=>new Date(b.l.added)-new Date(a.l.added)).slice(0,5);
  const one=recent.map(r=>`<span class="mqi" data-i="${r.i}"><b>${r.l.title}</b> <i>updated ${ago(r.l.added)}</i></span>`).join("");
  $("#mqt").innerHTML=one+one;
  document.querySelectorAll(".mqi").forEach(e=>e.onclick=()=>{location.hash="lesson-"+e.dataset.i});
  const w=$("#mqt").scrollWidth/2;$("#mqt").style.animationDuration=Math.max(15,w/60)+"s";
}
ticker();setInterval(ticker,60000);
$("#cbtn").onclick=()=>{const q=$("#qr");q.classList.toggle("on");$("#cbtn").textContent=q.classList.contains("on")?"Hide":"Click to reveal"};
</script>
